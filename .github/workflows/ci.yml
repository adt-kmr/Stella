name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install project + dev deps
        run: pip install -e ".[dev]"
      - name: Run test suite
        run: pytest tests/ -v
      - name: Lint
        run: |
          ruff check api pipeline scripts tests
          black --check api pipeline scripts tests