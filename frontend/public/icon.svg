<!-- STELLA. The depth ramp as a mark: near, mid, far, on the sheet.
     Square, hairline-ruled, no shadow — the same rules as the app. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="STELLA">
  <rect width="512" height="512" fill="#eef0ea"/>

  <!-- Registration marks, because a sheet is trimmed to register. -->
  <g stroke="#4a524d" stroke-width="4" opacity="0.5">
    <path d="M40 40h48M40 40v48"/>
    <path d="M472 40h-48M472 40v48"/>
    <path d="M40 472h48M40 472v-48"/>
    <path d="M472 472h-48M472 472v-48"/>
  </g>

  <!-- Three bars: near, mid, far. The hot end at the top. -->
  <rect x="112" y="176" width="288" height="44" fill="#ff5b2e"/>
  <rect x="112" y="234" width="288" height="44" fill="#14b09a"/>
  <rect x="112" y="292" width="288" height="44" fill="#22307e"/>

  <!-- The measured trace crossing the ramp: a flare climbing the tiers. -->
  <path d="M112 320 L176 316 L212 306 L232 268 L252 214 L276 190 L300 236 L324 300 L356 312 L400 314"
        fill="none" stroke="#12151a" stroke-width="7" stroke-linejoin="miter" stroke-linecap="butt"/>

  <!-- Tier rules, hairlined. -->
  <g stroke="#cbd1c7" stroke-width="3">
    <path d="M112 220h288M112 278h288M112 336h288"/>
  </g>

  <text x="256" y="404" text-anchor="middle" fill="#12151a"
        font-family="'Archivo','Helvetica Neue',Arial,sans-serif"
        font-size="44" font-weight="700" letter-spacing="6">STELLA</text>
  <text x="256" y="432" text-anchor="middle" fill="#4a524d"
        font-family="'JetBrains Mono',monospace"
        font-size="17" letter-spacing="3">UCS503</text>
</svg>